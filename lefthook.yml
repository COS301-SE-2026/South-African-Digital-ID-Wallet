pre-commit:
  parallel: false
  commands:
    web-lint:
      glob: "web/**/*.{ts,tsx,js,jsx}"
      root: "web"
      run: pnpm lint
      stage_fixed: true
    web-format:
      glob: "web/**/*.{ts,tsx,js,jsx,json,md}"
      root: "web"
      run: pnpm format
      stage_fixed: true
    web-build:
      glob: "web/src/**/*.{ts,tsx,js,jsx}"
      root: "web"
      run: pnpm build
      skip:
      - merge
      - rebase
      - cherry-pick
    backend-format:
      glob: "backend/FlashIdBackend/**/*.cs"
      root: "backend"
      run: pnpm format
      stage_fixed: true
    backend-lint:
      glob: "backend/FlashIdBackend/**/*.cs"
      root: "backend"
      run: pnpm lint
      stage_fixed: true
    backend-build:
      glob: "backend/FlashIdBackend/**/*.cs"
      root: "backend"
      run: pnpm build
      skip:
      - merge
      - rebase
      - cherry-pick
    mobile-lint:
      glob: "mobile/**/*.{ts,tsx,js,jsx}"
      root: "mobile"
      run: pnpm lint
      stage_fixed: true
    mobile-format:
      glob: "mobile/**/*.{ts,tsx,js,jsx,json,md}"
      root: "mobile"
      run: pnpm format
      stage_fixed: true
    mobile-type-check:
      glob: "mobile/**/*.{ts,tsx,js,jsx}"
      root: "mobile"
      run: pnpm type-check
    government-registry-format:
      glob: "government-registry/GovernmentRegistry/**/*.cs"
      root: "government-registry"
      run: pnpm format
      stage_fixed: true
    government-registry-lint:
      glob: "government-registry/GovernmentRegistry/**/*.cs"
      root: "government-registry"
      run: pnpm lint
      stage_fixed: true
    government-registry-build:
      glob: "government-registry/GovernmentRegistry/**/*.cs"
      root: "government-registry"
      run: pnpm build
      skip:
      - merge
      - rebase
      - cherry-pick