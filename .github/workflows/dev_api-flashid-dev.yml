# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - api-flashid-dev

on:
  push:
    branches:
      - dev
      - feature/qr-scanning-frontend
  workflow_dispatch:


env:
  PROJECT_PATH: backend/FlashIdBackend/Presentation/Presentation.csproj

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore Dependencies
        run: dotnet restore "${{env.PROJECT_PATH}}"

      - name: Build
        run: dotnet build "${{env.PROJECT_PATH}}" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "${{env.PROJECT_PATH}}" --configuration Release --no-build --output ./publish

      - name: Upload publish artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'api-flashid-dev'
          slot-name: 'Production'
          package: ./publish
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9B2671C2F93E4B3AB5921897445E516F }}