name: Web CI

on:
  push:
    branches: ["main", "dev"]
    paths: ['web/**']
  pull_request:
    branches: ["main", "dev"]
    paths: ['web/**']

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        env:
            AZUREFACEAPIREGISTRY: ${{ secrets.AZUREFACEAPIREGISTRY }}
            AZUREFACEAPIUSERNAME: ${{ secrets.AZUREFACEAPIUSERNAME }}
            AZUREFACEAPIPASSWORD: ${{ secrets.AZUREFACEAPIPASSWORD }}
            AZUREFACEAPIEMAIL: ${{ secrets.AZUREFACEAPIEMAIL }}
        run: |
         echo "Azure Face registry:"
         pnpm config get @azure-ai-vision-face:registry
         pnpm install --frozen-lockfile
        

      - name: Build
        run: pnpm run build
        working-directory: ./web

      - name: Run web tests with coverage
        run: pnpm -w run test:web:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./web/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}