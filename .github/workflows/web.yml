name: Web CI

on:
  push:
    branches: ["main", "dev"]
    paths: ['web/**']
  pull_request:
    branches: ["main", "dev"]
    paths: ['web/**']

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Get Azure Face client assets token
        shell: bash
        env: 
          AZURE_FACE_API_KEY: ${{ secrets.AZUREFACEAPIKEY }}
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            -H "Ocp-Apim-Subscription-Key: $AZURE_FACE_API_KEY" \
            "https://face-digitalwallet-dev.cognitiveservices.azure.com/face/v1.3-preview.1/settings/getClientAssetsAccessToken")

          token=$(echo "$response" | jq -r '.base64AccessToken')
          expiry=$(echo "$response" | jq -r '.expiry')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Azure Face did not return a client assets access token."
            exit 1
          fi

          echo "::add-mask::$token"
          echo "AZUREFACEAPIPASSWORD=$token" >> "$GITHUB_ENV"

          echo "Azure Face client assets token acquired."
          echo "Token expires: $expiry"

      - name: Install dependencies
        env:
            AZUREFACEAPIREGISTRY: ${{ secrets.AZUREFACEAPIREGISTRY }}
            AZUREFACEAPIUSERNAME: ${{ secrets.AZUREFACEAPIUSERNAME }}
            AZUREFACEAPIEMAIL: ${{ secrets.AZUREFACEAPIEMAIL }}
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Build
        run: pnpm run build
        working-directory: ./web

      - name: Run web tests with coverage
        run: pnpm -w run test:web:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./web/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}