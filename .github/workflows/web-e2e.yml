name: Web E2E

on:
  pull_request:
    branches: ["main", "dev"]
    paths: ["web/**", "backend/**"]
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
          MSSQL_PID: "Express"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'YourStrong!Passw0rd' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
          --health-start-period 30s

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5118
      NEXT_PUBLIC_API_URL: http://localhost:5118
      E2E_BASE_URL: http://localhost:3000
      E2E_PASSWORD: password123
      E2E_CITIZEN_EMAIL: citizen.e2e@flashid.local
      E2E_GOVADMIN_EMAIL: govadmin.e2e@flashid.local
      E2E_OFFICIAL_EMAIL: official.e2e@flashid.local

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./web

      - name: Restore backend
        run: dotnet restore backend/FlashIdBackend/FlashIdBackend.sln

      - name: Start backend (migrations and seeds)
        run: |
          nohup dotnet run --project backend/FlashIdBackend/Presentation/Presentation.csproj \
            > backend.log 2>&1 &

      - name: Wait for backend
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5118/swagger/index.html >/dev/null 2>&1; then
              echo "Backend up after $((i*3))s"; exit 0
            fi
              sleep 3
          done
          echo "Backend failed to start. Log:"; cat backend.log; exit 1

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox
        working-directory: ./web

      - name: Run Playwright E2E
        run: pnpm run test:e2e
        working-directory: ./web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload backend log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: backend.log
          retention-days: 7
