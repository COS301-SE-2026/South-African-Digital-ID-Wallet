name: Mobile CI

on:
  push:
    branches: ["main", "dev"]
    paths:
      - 'mobile/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: ["main", "dev"]
    paths:
      - 'mobile/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/mobile.yml'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ./mobile run lint:check

      - name: Type check
        run: pnpm --filter ./mobile run type-check

      - name: Run tests with coverage
        run: pnpm --filter ./mobile run test:coverage

      - name: Export bundle
        run: pnpm --filter ./mobile run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          directory: ./mobile/coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}