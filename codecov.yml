ignore:
  - "**/Migrations/**"
  - "**/obj/**"
  
  - "backend/FlashIdBackend/Infrastructure/Data/DbSeeder.cs"
  - "government-registry/GovernmentRegistry/Infrastructure/Data/DbSeeder.cs"
  - "government-registry/GovernmentRegistry/Infrastructure/Data/MockPhotoData.cs"
  
  - "backend/FlashIdBackend/Presentation/Program.cs"
  - "government-registry/GovernmentRegistry/Presentation/Program.cs"

  - "backend/FlashIdBackend/Infrastructure/Providers/AzureFaceLivenessServiceProvider.cs"
  - "backend/FlashIdBackend/Infrastructure/Providers/AzureCommunicationSmsProvider.cs"
  - "backend/FlashIdBackend/Infrastructure/Providers/SmsPortalProvider.cs"
  - "backend/FlashIdBackend/Infrastructure/Providers/EmailSenderProvider.cs"
  
flag_management:
  default_rules:
    carryforward: true   # reuse a flag's last report when this commit didn't upload it
  individual_flags:
    - name: backend
      paths: [backend/]
    - name: mobile
      paths: [mobile/]
    - name: web
      paths: [web/]
    - name: gov-registry
      paths: [government-registry/]
