  /api/officials/history:
    get:
      tags:
        - Officials
      summary: "Returns a paginated, filterable audit history for every official at the caller's own instaitution.\r\nInstitution is always derived server side from the authenticated official. Never accepted as a parameter.\r\nEvery call is itself audit-logged for POPIA accountability."
      parameters:
        - name: search
          in: query
          description: 'Free text filter matching action, citizen name, performing official''s name, or outcome/type.'
          schema:
            type: string
        - name: action
          in: query
          description: Filters to a specific audit event type.
          schema:
            type: string
        - name: dateFrom
          in: query
          description: Inclusive lower bound on the entity's timestamp.
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          description: Inclusive upper bound on the entity's timestamp.
          schema:
            type: string
            format: date-time
        - name: type
          in: query
          description: 'Filters by outcome: "Success" or "Failed".'
          schema:
            type: string
        - name: page
          in: query
          description: 1-based page number. Clamped server side to >= 1.
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          description: 'Items per page. Clamped server side to [1, 100], default 7.'
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested page of institution audit history.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OfficialHistoryResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OfficialHistoryResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OfficialHistoryResponseDto'
        '401':
          description: 'The caller is not authenticated, or the token could not be resolved to a user.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
