openapi: 3.0.4
info:
  title: FlashID API
  description: South African Digital ID Wallet backend API.
  version: v1
paths:
  /api/activate-credentials:
    post:
      tags:
        - ActivateCredentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateCredentialsRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ActivateCredentialsRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ActivateCredentialsRequestDto'
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ActivateCredentialsResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateCredentialsResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ActivateCredentialsResponseDto'
  /api/activity/me:
    get:
      tags:
        - ActivityOverview
      responses:
        '200':
          description: OK
  /api/admin/dashboard-summary:
    get:
      tags:
        - AdminDashboard
      summary: "Returns the admin dashboard landing page summary: system status, headline counts (users, institutions,\r\ncredentials issued), and a system wide recent activity feed. The feed is restricted to an explicit allow\r\nlist of institution/system-level event types so it never surfaces citizen-level data across institution boundaries."
      responses:
        '200':
          description: The dashboard summary.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDto'
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDto'
            text/json:
              schema:
                $ref: '#/components/schemas/DashboardSummaryDto'
        '403':
          description: The caller is not a Government Administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/admin/analytics:
    get:
      tags:
        - AdminDashboard
      summary: "Returns the system-wide analytics for the requested date range: verifications, credentials issued, \r\nactive officials, and active institutions, each with a value, a percentage change against the immediately\r\npreceding period of equal length, and a daily-bucketed series. Computed live with no pre-aggregation."
      parameters:
        - name: range
          in: query
          description: 'One of the "7d", "30d", "90d". Defaults to "30d" if omitted.'
          schema:
            type: string
      responses:
        '200':
          description: The requested analytics.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/AnalyticsResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/AnalyticsResponseDto'
        '400':
          description: The range parameter was not one of the allowed values.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The caller is not a Government Administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/auth/me:
    get:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/auth/login:
    post:
      tags:
        - Auth
      parameters:
        - name: X-Client
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: OK
  /api/auth/verify-device:
    post:
      tags:
        - Auth
      parameters:
        - name: X-Client
          in: header
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyDeviceRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyDeviceRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyDeviceRequestDto'
      responses:
        '200':
          description: OK
  /api/auth/resend-device-verification:
    post:
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendDeviceVerificationRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ResendDeviceVerificationRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResendDeviceVerificationRequestDto'
      responses:
        '200':
          description: OK
  /api/auth/logout:
    post:
      tags:
        - Auth
      responses:
        '200':
          description: OK
  /api/citizens/register:
    post:
      tags:
        - Citizens
      summary: Registers a new citizen account and sends an email verification OTP. Rate-limited to prevent registration abuse.
      requestBody:
        description: The citizen's registration details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterCitizenRequestDto'
      responses:
        '200':
          description: OK
        '201':
          description: The account was created.
        '400':
          description: The registration request was invalid.
        '409':
          description: An account with this email already exists.
  /api/citizens/verify-email:
    post:
      tags:
        - Citizens
      summary: Verifies a citizen's email address using the OTP sent during registration.
      requestBody:
        description: The email and OTP code to verify.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequestDto'
      responses:
        '200':
          description: OK
        '201':
          description: The email was verified.
        '400':
          description: 'The OTP was invalid, expired, already used, or too many attempts were made.'
  /api/citizens/resend-otp:
    post:
      tags:
        - Citizens
      summary: Resends the email verification OTP to a citizen who has not yet verified their emails. Rate-limited to prevent abuse.
      requestBody:
        description: The email address to resend the OTP to.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequestDto'
      responses:
        '200':
          description: OK
        '201':
          description: A new OTP was sent.
        '400':
          description: The email is already verified or the request was invalid.
  /api/credentials/me:
    get:
      tags:
        - Credentials
      responses:
        '200':
          description: OK
  /api/credentials/mine:
    get:
      tags:
        - Credentials
      responses:
        '200':
          description: OK
  '/api/credentials/{credentialId}/qr-token':
    post:
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateQrRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/GenerateQrRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/GenerateQrRequestDto'
      responses:
        '200':
          description: OK
  /api/credentials/resolve:
    post:
      tags:
        - Credentials
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveCredentialRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ResolveCredentialRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ResolveCredentialRequestDto'
      responses:
        '200':
          description: OK
  /api/credentials/expiry-check:
    post:
      tags:
        - Credentials
      summary: "Manually triggers the daily credential-expiry check. Government Administrator only.\r\nIdempotent. If today's check already completed or is currently running, returns that result instead of reprocessing."
      responses:
        '200':
          description: 'The check ran, or had already completed for today.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CredentialExpiryCheckResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialExpiryCheckResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CredentialExpiryCheckResponseDto'
        '409':
          description: Another expiry check is currently running for today.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The caller is not a Government Administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/credentials/citizens/{saId}/status':
    get:
      tags:
        - Credentials
      summary: Looks up a citizen in FlashID by SA ID and returns their onboarding status and existing credentials.
      parameters:
        - name: saId
          in: path
          description: The citizen's 13 digit SA ID number
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The citizen was found.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CitizenCredentialStatusResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenCredentialStatusResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CitizenCredentialStatusResponseDto'
        '400':
          description: The SA ID is not a valid 13 digit SA ID number.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No FlashID citizen record exists for this SA ID.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/credentials/issue:
    post:
      tags:
        - Credentials
      summary: Fetches a citizen's credential from the government registry and issues it into FlashID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/IssueCredentialRequestDto'
      responses:
        '201':
          description: The credential was issued.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CredentialResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CredentialResponseDto'
        '400':
          description: 'Validation error, or consent not given.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: 'Citizen not found in FlashID, or no matching record at the government registry.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Citizen is not Activated, or already has an active credential of that type.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/credentials/{credentialId}/revoke':
    post:
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCredentialRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/RevokeCredentialRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RevokeCredentialRequestDto'
      responses:
        '200':
          description: OK
  '/api/credentials/{credentialId}/reinstate':
    post:
      tags:
        - Credentials
      parameters:
        - name: credentialId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReinstateCredentialRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/ReinstateCredentialRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/ReinstateCredentialRequestDto'
      responses:
        '200':
          description: OK
  /api/credentials/search:
    get:
      tags:
        - Credentials
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
            default: 15
      responses:
        '200':
          description: OK
  '/api/credentials/citizen/{citizenId}':
    get:
      tags:
        - Credentials
      parameters:
        - name: citizenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /api/credentials/update-check:
    post:
      tags:
        - Credentials
      summary: Manually runs the daily citizen-credential update check.
      responses:
        '200':
          description: The check ran (or had already run today). See body for status.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CredentialUpdateCheckResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialUpdateCheckResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/CredentialUpdateCheckResponseDto'
        '409':
          description: Another update check is currently running for today.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not a Government Administrator.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/credentials/{credentialId}/offline-package':
    post:
      tags:
        - Credentials
      summary: 'Prepares the citizen''s offline credential package, minting it if none is stored or the stored one is stale.'
      parameters:
        - name: credentialId
          in: path
          description: The credential to prepare for offline presentation.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The offline package, ready to be cached on the device.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/OfflinePackageResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/OfflinePackageResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/OfflinePackageResponseDto'
        '400':
          description: The credential is not active.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The credential belongs to another citizen.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No credential with that id.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'The credential cannot produce a presentation: missing a photograph, or the document has expired.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: The package could not be prepared right now. The wallet should retry later.
  /api/credentials/issuer-keys:
    get:
      tags:
        - Credentials
      summary: 'Returns the public keys that verify offline credentials, for a verifier to cache before going offline.'
      responses:
        '200':
          description: 'The issuer key set, with the time it was retrieved so the verifier can age it.'
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/IssuerKeysResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/IssuerKeysResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/IssuerKeysResponseDto'
  /api/dashboard-account-card/me:
    get:
      tags:
        - DashboardAccountCard
      responses:
        '200':
          description: OK
  /api/account:
    delete:
      tags:
        - DeleteAccount
      responses:
        '200':
          description: OK
  /api/admin/audit-log:
    get:
      tags:
        - GovAdminAuditLog
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            format: int32
        - name: pageSize
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GovAdminAuditLogResponseDto'
            application/json:
              schema:
                $ref: '#/components/schemas/GovAdminAuditLogResponseDto'
            text/json:
              schema:
                $ref: '#/components/schemas/GovAdminAuditLogResponseDto'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/institutions/register:
    post:
      tags:
        - Institutions
      summary: Registers a new institution and assigns it an admin.
      requestBody:
        description: The institution's registration details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInstitutionRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/RegisterInstitutionRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RegisterInstitutionRequestDto'
      responses:
        '200':
          description: OK
        '201':
          description: The institution was created.
        '400':
          description: The registration request was invalid.
        '404':
          description: The specified admin was not found.
        '409':
          description: An institution with these details already exists.
        '403':
          description: The caller is not a Government Administrator.
  /api/institutions:
    get:
      tags:
        - Institutions
      summary: Returns all registered institutions.
      responses:
        '200':
          description: The list of institutions.
  '/api/institutions/{institutionId}':
    get:
      tags:
        - Institutions
      summary: Returns a single institution by its ID.
      parameters:
        - name: institutionId
          in: path
          description: The institution's unique identifier.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The requested institutions.
        '404':
          description: No institution exists with the given ID.
  /api/manage-user-account/me:
    get:
      tags:
        - ManageUserAccount
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ManageUserAccountDto'
            application/json:
              schema:
                $ref: '#/components/schemas/ManageUserAccountDto'
            text/json:
              schema:
                $ref: '#/components/schemas/ManageUserAccountDto'
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/manage-user-account/email/verify-password:
    post:
      tags:
        - ManageUserAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/VerifyPasswordRequestDto'
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '423':
          description: Locked
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/manage-user-account/email/request-change:
    post:
      tags:
        - ManageUserAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequestDto'
          text/json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequestDto'
          application/*+json:
            schema:
              $ref: '#/components/schemas/RequestEmailChangeRequestDto'
